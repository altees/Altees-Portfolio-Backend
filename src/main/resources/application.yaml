spring:
  application:
    name: Altees-Portfolio-Backend

  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

server:
  port: 8080

logging:
  level:
    com.altees.portfolio: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
